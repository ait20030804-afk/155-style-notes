      <article class="about-copy" aria-label="关于 155 STYLE NOTES">
        <p>很多穿搭内容告诉我们什么好看，却很少回答：<span class="about-copy-phrase">到了具体的场合</span>，<span class="about-copy-phrase">怎样穿得合适</span>，也穿得像自己。</p>

        <p>155 STYLE NOTES 就从这些犹豫开始，把面试、实习、通勤、约会、周末出行与旅行，整理成六份场景穿搭笔记。</p>

        <p>这份笔记写给身高 150–160cm 的女生。不是不会穿，只是常常找不到真正把身高、场合和预算放在一起考虑的参考。</p>

        <p>这里的每套穿搭都提前整理好搭配逻辑，再根据身高区间与风格偏好进行匹配。它们不是临时生成的答案。</p>

        <p>它不是一套穿衣规则，而是一份可以随时翻看的参考。</p>
      </article>
